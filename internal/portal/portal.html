<!doctype html>
<html lang="__LLM_WORKBENCH_LANG__">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LLM Workbench</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f5f5f2;
    --panel: #ffffff;
    --sunken: #fafaf8;
    --ink: #141416;
    --muted: #6e6e75;
    --faint: #91919a;
    --line: #e5e5df;
    --line-strong: #d3d3cb;
    --accent: #0d7a6b;
    --accent-soft: rgba(13, 122, 107, .10);
    --blue: #1f5fd0;
    --blue-soft: rgba(31, 95, 208, .10);
    --violet: #6d43d8;
    --violet-soft: rgba(109, 67, 216, .09);
    --purple: #9622b8;
    --purple-soft: rgba(150, 34, 184, .10);
    --sky: #0b6f95;
    --sky-soft: rgba(11, 111, 149, .10);
    --ink-btn: #16161a;
    --ink-btn-text: #ffffff;
    --ok: #0e8049;
    --ok-soft: rgba(14, 128, 73, .10);
    --warn: #96650a;
    --warn-soft: rgba(150, 101, 10, .11);
    --danger: #b02a1c;
    --danger-soft: rgba(176, 42, 28, .08);
    --chip: rgba(20, 20, 22, .05);
    --shadow: 0 1px 2px rgba(20, 20, 22, .05);
    --mono: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #0d0e0f;
      --panel: #17181a;
      --sunken: #121314;
      --ink: #ecece8;
      --muted: #9b9ba3;
      --faint: #7c7c84;
      --line: #26282a;
      --line-strong: #34373a;
      --accent: #45cfb7;
      --accent-soft: rgba(69, 207, 183, .13);
      --blue: #7ea2ff;
      --blue-soft: rgba(126, 162, 255, .13);
      --violet: #bc9bff;
      --violet-soft: rgba(188, 155, 255, .12);
      --purple: #e2a1ff;
      --purple-soft: rgba(226, 161, 255, .12);
      --sky: #74c8ea;
      --sky-soft: rgba(116, 200, 234, .12);
      --ink-btn: #ecece8;
      --ink-btn-text: #101112;
      --ok: #48c47c;
      --ok-soft: rgba(72, 196, 124, .12);
      --warn: #e0b03e;
      --warn-soft: rgba(224, 176, 62, .13);
      --danger: #ff7a6d;
      --danger-soft: rgba(255, 122, 109, .10);
      --chip: rgba(255, 255, 255, .06);
      --shadow: 0 1px 2px rgba(0, 0, 0, .35);
    }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    display: flex; flex-direction: column;
    height: 100dvh; overflow: hidden;
    background: var(--bg); color: var(--ink);
    font: 14px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
          "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    -webkit-font-smoothing: antialiased;
    font-variant-numeric: tabular-nums;
  }
  h1, h2 { margin: 0; font-weight: 600; }
  code, .mono { font-family: var(--mono); font-size: 12.5px; }

  /* ---- top bar -------------------------------------------------------- */
  .bar {
    flex: none; display: flex; align-items: center; gap: 14px;
    padding: 12px 20px; background: var(--panel);
    border-bottom: 1px solid var(--line);
  }
  .mark {
    flex: none; width: 30px; height: 30px; border-radius: 9px;
    display: grid; place-items: center;
    background: var(--ink); color: var(--bg);
    font: 600 9.5px/1 var(--mono); letter-spacing: .06em;
  }
  .brand { display: flex; align-items: center; gap: 11px; min-width: 0; }
  .brand h1 { font-size: 15px; letter-spacing: -0.01em; white-space: nowrap; }
  .brand p { margin: 1px 0 0; color: var(--muted); font-size: 12px; white-space: nowrap;
             overflow: hidden; text-overflow: ellipsis; }
  .nav { display: flex; gap: 2px; flex: none; }
  .nav a {
    display: inline-flex; align-items: center; height: 30px;
    padding: 0 11px; border-radius: 7px;
    color: var(--muted); text-decoration: none; font-size: 13px;
    transition: color .14s ease, background .14s ease;
  }
  .nav a:hover { color: var(--ink); background: var(--chip); }
  .nav a[aria-current="page"] { color: var(--ink); background: var(--accent-soft); font-weight: 600; }
  .chips { display: flex; gap: 6px; margin-left: auto; flex-wrap: wrap; justify-content: flex-end; }
  .chip {
    font: 11.5px/1 var(--mono); color: var(--muted);
    border: 1px solid var(--line); border-radius: 7px;
    padding: 5px 7px; white-space: nowrap;
  }
  .status {
    display: inline-flex; align-items: center; gap: 7px;
    font-size: 12.5px; color: var(--ok); font-weight: 500;
    padding: 0 2px;
  }
  .status .dot {
    width: 7px; height: 7px; border-radius: 50%; background: currentColor;
    box-shadow: 0 0 0 3px var(--ok-soft);
  }
  .status.stopped { color: var(--faint); }
  .status.stopped .dot { box-shadow: 0 0 0 3px var(--chip); }
  .actions { display: flex; align-items: center; gap: 12px; flex: none; }

  /* ---- shell ---------------------------------------------------------- */
  .shell {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr);
    gap: 14px; padding: 14px 20px 16px;
  }
  .col { display: flex; flex-direction: column; gap: 14px; min-height: 0; }
  .col.left { overflow-y: auto; gap: 10px; }
  /* Save/restore stays reachable while the settings column scrolls. */
  .col.left .toolbar-panel { position: sticky; top: 0; z-index: 3; }
  .panel {
    background: var(--panel); border: 1px solid var(--line);
    border-radius: 12px; box-shadow: var(--shadow);
    display: flex; flex-direction: column;
  }
  .panel-head {
    flex: none; display: flex; align-items: center; gap: 8px;
    padding: 9px 12px 0;
  }
  .panel-head h2 {
    font-size: 11px; letter-spacing: .1em; text-transform: uppercase;
    color: var(--muted);
  }
  .panel-body { padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 8px; min-height: 0; }
  .panel-body.grow { flex: 1; }
  .toolbar-panel .panel-body { flex-direction: row; align-items: center; padding: 7px 11px; gap: 8px; }
  .toolbar-panel .panel-body .msg { min-height: 0; line-height: 1.35; }
  .aside-note { margin-left: auto; color: var(--faint); font-size: 11px; }
  .label-row { display: flex; align-items: baseline; gap: 8px; }
  .label-row .aside-note { margin-left: 0; }
  .label-row > .aside-note:nth-child(2) { margin-left: auto; }
  .label-row .aside-note.bad { color: var(--danger); }
  .label-row .aside-note.good { color: var(--muted); }

  /* ---- settings ------------------------------------------------------- */
  label { display: block; font-size: 12px; color: var(--muted); }
  input[type="text"], input[type="number"], select, textarea {
    width: 100%; margin-top: 4px;
    font: 13px/1.4 var(--mono); color: var(--ink);
    background: var(--sunken); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 9px;
    transition: border-color .15s ease, box-shadow .15s ease;
  }

  /* Dense form rows: label on the left, control on the right. */
  .form { display: flex; flex-direction: column; gap: 7px; min-height: 0; }
  .f { display: grid; grid-template-columns: 112px minmax(0, 1fr); align-items: center; gap: 10px; }
  .f > span { font-size: 12px; color: var(--muted); line-height: 1.3; }
  .f > input, .f > select { margin-top: 0; }
  .f2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .f3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .fa { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
  .fa > span { font-size: 11.5px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .fa input, .fa select { margin-top: 0; }
  .f2 .switch { height: 30px; }
  .divider {
    display: flex; align-items: baseline; gap: 8px;
    margin-top: 2px; padding-top: 7px; border-top: 1px solid var(--line);
    font-size: 11px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted);
  }
  .divider .aside-note { text-transform: none; letter-spacing: 0; font-size: 11px; }

  /* Rarely touched settings fold away to keep the column short. */
  .panel.foldable > summary.panel-head {
    cursor: pointer; list-style: none; padding-bottom: 9px;
    border-radius: 11px 11px 0 0;
  }
  .panel.foldable > summary.panel-head:hover { background: var(--chip); }
  .panel.foldable:not([open]) > summary.panel-head { border-radius: 11px; }
  .panel.foldable > summary.panel-head::-webkit-details-marker { display: none; }
  .panel.foldable .chev {
    flex: none; color: var(--muted); font-size: 10px;
    transition: transform .15s ease;
  }
  .panel.foldable:not([open]) .chev { transform: rotate(-90deg); }
  select { font-family: inherit; font-size: 13px; }
  input:hover, select:hover, textarea:hover { border-color: var(--line-strong); }
  input:focus, select:focus, textarea:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }
  textarea { resize: none; flex: 1; min-height: 92px; }
  .col.left textarea { resize: vertical; min-height: 54px; max-height: 45vh; }
  /* JSON objects need room to read and edit; both editors stay draggable. */
  .col.left textarea.json { min-height: 112px; }
  .growable { display: flex; flex-direction: column; flex: 1; min-height: 0; gap: 3px; }
  .growable > .label-row, .growable > span { font-size: 12px; color: var(--muted); }
  .growable textarea { margin-top: 0; }

  /* ---- buttons -------------------------------------------------------- */
  button {
    font: inherit; font-size: 13px; cursor: pointer;
    border-radius: 8px; padding: 7px 13px;
    border: 1px solid var(--ink-btn);
    background: var(--ink-btn); color: var(--ink-btn-text);
    transition: opacity .14s ease, transform .06s ease, background .14s ease;
  }
  button:hover:not(:disabled) { opacity: .86; }
  button:active:not(:disabled) { transform: translateY(1px); }
  button:disabled { opacity: .4; cursor: not-allowed; }
  button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  button.ghost { background: transparent; color: var(--ink); border-color: var(--line-strong); }
  button.ghost:hover:not(:disabled) { background: var(--chip); opacity: 1; }
  button.danger { background: transparent; color: var(--danger); border-color: var(--line-strong); }
  button.danger:hover:not(:disabled) { background: var(--danger-soft); border-color: var(--danger); opacity: 1; }
  button.small { font-size: 12px; padding: 4px 10px; border-radius: 7px; }
  .row { display: flex; align-items: center; gap: 9px; flex-wrap: wrap; }

  /* ---- switch --------------------------------------------------------- */
  .switch { display: flex; align-items: center; gap: 10px; cursor: pointer; user-select: none; }
  .switch input { position: absolute; opacity: 0; width: 1px; height: 1px; }
  .track {
    flex: none; width: 36px; height: 21px; border-radius: 999px;
    background: var(--line-strong); position: relative;
    transition: background .18s ease;
  }
  .knob {
    position: absolute; top: 2px; left: 2px; width: 17px; height: 17px;
    border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0, 0, 0, .28);
    transition: transform .2s cubic-bezier(.2, .8, .25, 1);
  }
  .switch input:checked + .track { background: var(--ok); }
  .switch input:checked + .track .knob { transform: translateX(15px); }
  .switch input:focus-visible + .track { outline: 2px solid var(--accent); outline-offset: 2px; }
  .switch input:disabled + .track { opacity: .4; }
  .switch input:disabled ~ .switch-label { color: var(--faint); }
  .switch-label { font-size: 13px; color: var(--ink); }
  .switch-state { margin-left: auto; font-size: 12px; color: var(--muted); }
  .switch-state.on { color: var(--ok); }
  .switch-state.off { color: var(--faint); }

  .pathline {
    margin: 0; font-family: var(--mono); font-size: 11.5px; color: var(--faint);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .facts { margin: 0; display: grid; gap: 4px; }
  .facts div { display: grid; grid-template-columns: 62px minmax(0, 1fr); gap: 10px; align-items: baseline; }
  .facts dt { font-size: 11.5px; color: var(--muted); }
  .facts dd {
    margin: 0; font-family: var(--mono); font-size: 11.5px; color: var(--muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .msg { margin: 0; font-size: 12px; color: var(--muted); min-height: 18px; }
  .msg:empty { display: none; }
  .msg.ok { color: var(--ok); }
  .msg.err { color: var(--danger); }
  .hint { font-size: 11.5px; color: var(--faint); margin: 0; }
  .hint[hidden] { display: none; }

  /* ---- logs ----------------------------------------------------------- */
  .live { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--muted); }
  .live .pulse {
    width: 6px; height: 6px; border-radius: 50%; background: var(--ok);
    animation: pulse 1.6s ease-in-out infinite;
  }
  .live.paused .pulse { background: var(--faint); animation: none; }
  .logs .panel-head { padding-bottom: 10px; }
  .logs .spacer { margin-left: auto; }
  .loglist {
    flex: 1; min-height: 0; margin: 0 10px 10px;
    padding: 8px; overflow-y: auto;
    background: var(--sunken); border: 1px solid var(--line); border-radius: 9px;
    font: 12.5px/1.65 var(--mono);
    scrollbar-width: thin;
  }
  .loglist.is-empty { display: grid; place-items: center; }
  /* The message is injected as data-empty so it follows the UI language. */
  .loglist.is-empty::before {
    content: attr(data-empty);
    color: var(--faint); font-family: inherit; font-size: 12px;
  }
  .logrow {
    display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px;
    padding: 2px 7px;
    border-left: 2px solid transparent;
    white-space: pre-wrap; word-break: break-word;
  }
  .logrow:hover { background: var(--chip); }
  /* Plain-text rows keep the wrapped text aligned past the timestamp. */
  .logrow.plain { display: grid; grid-template-columns: auto minmax(0, 1fr); }
  .logrow.lv-error { border-left-color: var(--danger); background: var(--danger-soft); }
  .logrow.lv-warn { border-left-color: var(--warn); background: var(--warn-soft); }
  .logrow.lv-ok { border-left-color: var(--ok); }
  .logtime { flex: none; color: var(--faint); font-size: 11.5px; }
  .verb, .status, .note {
    flex: none; font-weight: 600; border-radius: 5px;
    padding: 0 6px; font-size: 11px; letter-spacing: .01em;
    line-height: 17px;
  }
  .verb { background: var(--chip); color: var(--muted); min-width: 44px; text-align: center; }
  .verb.v-get { color: var(--ok); background: var(--ok-soft); }
  .verb.v-head { color: var(--accent); background: var(--accent-soft); }
  .verb.v-post { color: var(--blue); background: var(--blue-soft); }
  .verb.v-put { color: var(--warn); background: var(--warn-soft); }
  .verb.v-patch { color: var(--purple); background: var(--purple-soft); }
  .verb.v-del { color: var(--danger); background: var(--danger-soft); }
  .logpath { color: var(--ink); }
  .path-root { font-weight: 600; }
  .path-root.root-api { color: var(--sky); }
  .path-root.root-v1 { color: var(--violet); }
  .path-query { color: var(--faint); }
  .arrow { color: var(--faint); }
  .status { min-width: 34px; text-align: center; }
  .status.st-2xx { color: var(--ok); background: var(--ok-soft); }
  .status.st-3xx { color: var(--blue); background: var(--blue-soft); }
  .status.st-4xx { color: var(--warn); background: var(--warn-soft); }
  .status.st-5xx { color: var(--danger); background: var(--danger-soft); }
  .note { font-weight: 500; }
  .note-inject { color: var(--accent); background: var(--accent-soft); }
  .note-native { color: var(--violet); background: var(--violet-soft); }
  .note-pass { color: var(--muted); }
  .note-warn { color: var(--warn); background: var(--warn-soft); }
  .client { color: var(--violet); margin-left: auto; font-size: 11.5px; opacity: .85; }
  .logtext { color: var(--ink); }
  .hl-bad { color: var(--danger); font-weight: 600; }
  .hl-good { color: var(--ok); font-weight: 600; }
  .hl-tag { color: var(--accent); font-weight: 600; }
  .hl-portal { color: var(--violet); font-weight: 600; }
  .hl-num { color: var(--warn); }

  /* ---- responsive ----------------------------------------------------- */
  @media (max-width: 1000px), (max-height: 620px) {
    body { height: auto; min-height: 100dvh; overflow: auto; }
    .bar { flex-wrap: wrap; }
    .chips { order: 3; width: 100%; margin-left: 0; justify-content: flex-start; }
    .shell { grid-template-columns: minmax(0, 1fr); }
    .col.left { overflow: visible; }
    .logs { min-height: 380px; }
    .logs .loglist { height: min(50vh, 420px); flex: none; }
  }
  @media (max-width: 620px) {
    .bar { padding: 10px 14px; gap: 10px; }
    .nav { order: 2; width: 100%; }
    .nav a { height: 36px; flex: 1; justify-content: center; }
    .brand p { display: none; }
    .shell { padding: 10px 12px 14px; gap: 10px; }
    .actions { margin-left: auto; }
    button { min-height: 40px; }
    .f, .f2, .f3 { grid-template-columns: minmax(0, 1fr); }
    .f { gap: 2px; }
    .f { gap: 2px; }
    .facts div { grid-template-columns: 56px minmax(0, 1fr); }
  }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .25; } }
  @media (prefers-reduced-motion: reduce) {
    * { animation: none !important; transition: none !important; }
  }
</style>
</head>
<body>
<header class="bar">
  <div class="brand">
    <span class="mark" aria-hidden="true">LW</span>
    <div>
      <h1>LLM Workbench</h1>
      <p data-i18n="app.tagline">本机 LLM 代理与实验工作台 · 支持 Ollama 与更多 Provider</p>
    </div>
  </div>
  <nav class="nav" aria-label="LLM Workbench">
    <a href="/_/llm-proxy" aria-current="page" data-i18n="nav.proxy">代理</a>
    <a href="/_/workbench/#requests" data-i18n="nav.requests">请求</a>
    <a href="/_/workbench/#playground" data-i18n="nav.playground">试验场</a>
    <a href="/_/workbench/#experiments" data-i18n="nav.experiments">实验</a>
  </nav>
  <div class="chips">
    <span class="chip" id="version">v…</span>
    <span class="chip" id="listenChip">—</span>
    <span class="chip" id="pidChip">pid —</span>
  </div>
  <div class="actions">
    <span class="status" id="statusPill"><i class="dot"></i><span id="statusText" data-i18n="status.running">运行中</span></span>
    <button id="langToggle" class="ghost small">EN</button>
    <button id="shutdown" class="danger" data-i18n="action.shutdown">关闭服务</button>
  </div>
</header>

<main class="shell">
  <div class="col left">
    <section class="panel toolbar-panel">
      <div class="panel-body">
        <button id="save" data-i18n="action.save">保存并生效</button>
        <button id="defaults" class="ghost" data-i18n="action.defaults">恢复默认</button>
        <span class="msg" id="cfgMsg" role="status"></span>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2 data-i18n="panel.params">上游与参数</h2>
        <span class="aside-note" data-i18n="hint.restart">改动后需重启</span>
      </div>
      <div class="panel-body form">
        <label class="f" for="upstream"><span data-i18n="field.upstream">上游 Ollama 地址</span>
          <input id="upstream" type="text" spellcheck="false" autocomplete="off">
        </label>
        <div class="f3">
          <label class="fa" for="timeout"><span data-i18n="field.timeout">超时（秒）</span>
            <input id="timeout" type="number" min="1" step="1">
          </label>
          <label class="fa" for="maxConcurrent"><span data-i18n="field.maxConcurrent">最大并发</span>
            <input id="maxConcurrent" type="number" min="1" step="1">
          </label>
          <label class="fa" for="maxBodySize"><span data-i18n="field.maxBodySize">请求体上限（字节）</span>
            <input id="maxBodySize" type="number" min="1" step="1">
          </label>
        </div>
        <label class="growable" for="params">
          <span class="label-row"><span data-i18n="field.params">注入参数（JSON 对象）</span>
            <span class="aside-note" data-i18n="panel.paramsNote">只补客户端没传的字段</span>
            <span class="aside-note" id="paramsMeta"></span></span>
          <textarea id="params" class="json" rows="6" spellcheck="false" autocomplete="off"
                    placeholder='{"max_tokens": 96, "temperature": 0.2}'></textarea>
        </label>
      </div>
    </section>

    <section class="panel">
      <div class="panel-head">
        <h2 data-i18n="panel.policy">思考与提示词</h2>
        <span class="aside-note good" data-i18n="panel.policyNote">立即生效</span>
      </div>
      <div class="panel-body form">
        <div class="f2">
          <label class="fa" for="thinking"><span data-i18n="field.thinking">Thinking 模式</span>
            <select id="thinking">
              <option value="off" data-i18n="thinking.off">off</option>
              <option value="on" data-i18n="thinking.on">on</option>
              <option value="passthrough" data-i18n="thinking.passthrough">passthrough</option>
            </select>
          </label>
          <label class="fa" for="systemMode"><span data-i18n="field.systemMode">System Prompt 模式</span>
            <select id="systemMode">
              <option value="off" data-i18n="prompt.off">关闭</option>
              <option value="inject-if-missing" data-i18n="prompt.inject">缺失时注入</option>
              <option value="override" data-i18n="prompt.override">覆盖已有</option>

  var LANG = "zh";

  function t(key, vars) {
    var table = DICT[LANG] || DICT.zh;
    var text = table[key];
    if (text === undefined) { text = DICT.zh[key] || key; }
    if (vars) {
      Object.keys(vars).forEach(function (name) {
        text = text.split("{" + name + "}").join(String(vars[name]));
      });
    }
    return text;
  }

  function $(id) { return document.getElementById(id); }

  function applyLang(next) {
    LANG = next === "en" ? "en" : "zh";
    document.documentElement.lang = LANG === "en" ? "en" : "zh-CN";
    document.title = t("app.title");
    document.querySelectorAll("[data-i18n]").forEach(function (node) {
      node.textContent = t(node.dataset.i18n);
    });
    $("langToggle").textContent = LANG === "en" ? "中文" : "EN";
    $("langToggle").title = t("action.lang");
    $("logList").dataset.empty = t("logs.empty");
    refreshChrome();
  }

  // refreshChrome re-renders the text that depends on the last known state,
  // without touching the inputs the user may have edited.
  function refreshChrome() {
    $("logPause").textContent = log.paused ? t("action.resume") : t("action.pause");
    $("liveLabel").textContent = log.stopping
      ? t("live.stopped")
      : (log.paused ? t("live.paused") : t("live.everySecond"));
    $("logCount").textContent = t("logs.count", { n: $("logList").childElementCount });
    updateParamsMeta();
    if (!state) { return; }
    renderAutostart(state.autostart);
    if (log.stopping) {
      setStatus(t("status.stopped"), true);
    } else {
      setStatus(t(state.stopping ? "status.stopping" : "status.running"), false);
    }
  }

  function api(path, options) {
    return fetch(BASE + path, options).then(function (res) {
      return res.json().catch(function () { return { error: "HTTP " + res.status }; })
        .then(function (data) {
          if (!res.ok) {
            var err = data && data.error;
            throw new Error(typeof err === "string" ? err : (err && err.message) || ("HTTP " + res.status));
          }
          return data;
        });
    });
  }

  function post(path, body, method) {
    return api(path, {
      method: method || "POST",
      headers: { "Content-Type": "application/json" },
      body: body === undefined ? undefined : JSON.stringify(body)
    });
  }

  function msg(id, text, kind) {
    var el = $(id);
    el.textContent = text || "";
    el.className = "msg" + (kind ? " " + kind : "");
  }

  function setText(id, text) {
    var el = $(id);
    el.textContent = text;
    el.title = text;
  }

  // Absolute paths lose their meaning when truncated at the tail, so keep the
  // head and the file name and drop the middle.
  function shortenPath(path, max) {
    if (!path) { return "—"; }
    if (path.length <= max) { return path; }
    var head = 12;
    var tail = max - head - 1;
    return path.slice(0, head) + "…" + path.slice(path.length - tail);
  }

  function setPath(id, path) {
    var el = $(id);
    el.dataset.full = path || "";
    el.title = path || "";
    fitPath(el);
  }

  // Fit a path into its column: middle-truncated, never tail-truncated by CSS.
  function fitPath(el) {
    var path = el.dataset.full || "";
    if (!path) {
      el.textContent = "—";
      return;
    }
    var perChar = 7;
    var budget = Math.max(16, Math.floor((el.clientWidth - 2) / perChar));
    el.textContent = shortenPath(path, budget);
  }

  window.addEventListener("resize", function () {
    document.querySelectorAll("[data-full]").forEach(fitPath);
  });

  // A folded panel has no width to measure, so paths are re-fitted on open.
  document.querySelectorAll("details.foldable").forEach(function (fold) {
    fold.addEventListener("toggle", function () {
      if (!fold.open) { return; }
      fold.querySelectorAll("[data-full]").forEach(fitPath);
    });
  });

  function busy(ids, flag) {
    ids.forEach(function (id) { $(id).disabled = flag; });
  }

  function fail(id, err) {
    msg(id, err && err.message ? err.message : String(err), "err");
  }

  function stripScheme(url) {
    return String(url || "").replace(/^https?:\/\//, "");
  }

  function renderAutostart(a) {
    var label = !a.supported
      ? t("autostart.macOnly")
      : (a.installed
          ? (a.loaded ? t("autostart.installedLoaded") : t("autostart.installedNotLoaded"))
          : t("autostart.notInstalled"));
    $("asState").textContent = label;
    $("asState").className = "switch-state " + (a.installed ? "on" : "off");
    $("asToggle").checked = !!a.installed;
  }

  function render(next) {
    state = next;
    $("version").textContent = next.version ? "v" + next.version : "dev";
    $("listenChip").textContent = stripScheme(next.listen);
    $("pidChip").textContent = "pid " + next.pid;
    setPath("configPath", next.config_path);
    setPath("logPath", next.log_path);
    $("logCount").textContent = t("logs.capacity", { n: next.log_capacity || 0 });

    var a = next.autostart;
    renderAutostart(a);
    $("asToggle").disabled = !a.supported || !next.launch_ready || next.stopping;
    $("asHint").hidden = a.supported;
    setPath("plistPath", a.plist_path);

    $("upstream").value = next.upstream;
    $("timeout").value = String(next.timeout);
    $("params").value = JSON.stringify(next.params, null, 2);
    $("maxConcurrent").value = String(next.max_concurrent);
    $("maxBodySize").value = String(next.max_body_size);
    $("thinking").value = next.thinking || "off";
    var prompt = next.system_prompt || {};
    $("systemMode").value = prompt.mode || "off";
    $("systemText").value = prompt.text || "";
    var history = next.inspector || {};
    $("insEnabled").checked = !!history.enabled;
    $("captureBodies").checked = !!history.capture_bodies;
    $("retentionDays").value = String(history.retention_days || 0);
    $("maxRows").value = String(history.max_rows || 0);
    $("maxBodyBytes").value = String(history.max_body_bytes || 0);
    $("dbPath").value = (next.storage && next.storage.path) || "";
    updateParamsMeta();
  }

  function loadState() {
    return api("state").then(render).catch(function (err) { fail("cfgMsg", err); });
  }

  function setStatus(text, stopped) {
    $("statusText").textContent = text;
    $("statusPill").className = "status" + (stopped ? " stopped" : "");
  }

  // ---- params validation ---------------------------------------------
  function updateParamsMeta() {
    var meta = $("paramsMeta");
    var parsed;
    try {
      parsed = JSON.parse($("params").value || "{}");
    } catch (err) {
      meta.textContent = t("params.badJSON");
      meta.className = "aside-note bad";
      return;
    }
    if (!parsed || typeof parsed !== "object" || Array.isArray(parsed)) {
      meta.textContent = t("params.notObject");
      meta.className = "aside-note bad";
      return;
    }
    var keys = Object.keys(parsed);
    meta.textContent = keys.length ? t("params.count", { n: keys.length }) : t("params.empty");
    meta.className = "aside-note good";
  }

  // ---- log rendering -----------------------------------------------------
  var LEVEL_CLASS = { error: "lv-error", warn: "lv-warn", ok: "lv-ok", info: "" };
  var VERB_CLASS = {
    GET: "v-get", HEAD: "v-head", POST: "v-post",
    PUT: "v-put", PATCH: "v-patch", DELETE: "v-del"
  };
  // Plain-text lines (startup, portal actions, failures) get keyword colour
  // only — text is always appended as text nodes, never as HTML. Both
  // languages are matched, because log lines written before a language switch
  // stay in the buffer.
  var TEXT_RULES = [
    { re: /(失败|错误|异常|超时|Traceback|refused|timeout|Timeout|failed|Failed|error|502|503|504)/, cls: "hl-bad" },
    { re: /(已启动|已安装|已加载|已保存|已删除|已生效|已关闭|成功|installed|loaded|saved|applied|removed|started)/, cls: "hl-good" },
    { re: /(proxy:\s*\S+)/, cls: "hl-portal" },
    { re: /(injected:v1|injected:native|pass\([^)]*\)|\bstart\b|\bstop\b)/, cls: "hl-tag" },
    { re: /(\d+(?:\.\d+)?\s?(?:ms|秒|s)\b)/, cls: "hl-num" }
  ];

  function el(tag, cls, text) {
    var node = document.createElement(tag);
    if (cls) { node.className = cls; }
    if (text !== undefined) { node.textContent = text; }
    return node;
  }

  function hhmmss(stamp) {
    var parts = String(stamp || "").split(" ");
    return parts.length > 1 ? parts[1] : String(stamp || "");
  }

  function statusClass(code) {
    var n = Number(code) || 0;
    if (n >= 500) { return "st-5xx"; }
    if (n >= 400) { return "st-4xx"; }
    if (n >= 300) { return "st-3xx"; }
    return "st-2xx";
  }

  function appendHighlighted(parent, text) {
    var rest = String(text || "");
    var guard = 0;
    while (rest && guard++ < 40) {
      var best = null;
      for (var i = 0; i < TEXT_RULES.length; i++) {
        var m = TEXT_RULES[i].re.exec(rest);
        if (m && (!best || m.index < best.index)) {
          best = { index: m.index, len: m[0].length, cls: TEXT_RULES[i].cls };
        }
      }
      if (!best) { break; }
      if (best.index > 0) {
        parent.appendChild(document.createTextNode(rest.slice(0, best.index)));
      }
      parent.appendChild(el("span", best.cls, rest.slice(best.index, best.index + best.len)));
      rest = rest.slice(best.index + best.len);
    }
    if (rest) { parent.appendChild(document.createTextNode(rest)); }
  }

  // renderPath tints the endpoint family (/api vs /v1) and dims the query
  // string, so a long path is still readable at a glance.
  function renderPath(path) {
    var wrap = el("span", "logpath");
    var raw = String(path || "");
    if (!raw) { return wrap; }
    var cut = raw.indexOf("?");
    var target = cut === -1 ? raw : raw.slice(0, cut);
    var query = cut === -1 ? "" : raw.slice(cut);
    var match = /^(\/(?:api|v1))(\/.*)?$/.exec(target);
    if (match) {
      var rootClass = match[1] === "/v1" ? "root-v1" : "root-api";
      wrap.appendChild(el("span", "path-root " + rootClass, match[1]));
      if (match[2]) {
        wrap.appendChild(document.createTextNode(match[2]));
      }
    } else {
      wrap.appendChild(document.createTextNode(target));
    }
    if (query) { wrap.appendChild(el("span", "path-query", query)); }
    return wrap;
  }

  // Injection notes are language-neutral tokens (injected:v1, pass,
  // pass(non-json), busy), so the colours never depend on the UI language.
  function noteClass(note) {
    var text = String(note || "");
    if (text.indexOf("injected:native") === 0) { return "note-native"; }
    if (text.indexOf("injected") === 0) { return "note-inject"; }
    if (text.indexOf("non-json") !== -1 || text.indexOf("pass(") === 0 || text.indexOf("busy") === 0) {
      return "note-warn";
    }
    return "note-pass";
  }

  function renderEntry(entry) {
    var row = el("div", "logrow " + (LEVEL_CLASS[entry.level] || ""));
    row.title = entry.text || "";
    row.appendChild(el("span", "logtime", hhmmss(entry.time)));
    if (entry.kind === "request") {
      var verb = entry.method || "";
      row.appendChild(el("span", "verb " + (VERB_CLASS[verb] || ""), verb));
      row.appendChild(renderPath(entry.path));
      row.appendChild(el("span", "arrow", "→"));
      row.appendChild(el("span", "status " + statusClass(entry.status), String(entry.status)));
      if (entry.note) {
        row.appendChild(el("span", "note " + noteClass(entry.note), entry.note));
      }
      if (entry.client) { row.appendChild(el("span", "client", entry.client)); }
      return row;
    }
    var text = el("span", "logtext");
    row.className += " plain";
    appendHighlighted(text, entry.text);
    row.appendChild(text);
    return row;
  }

  function logTick() {
    if (log.paused || log.stopping || log.inflight) { return; }
    log.inflight = true;
    api("log?since=" + log.seq).then(function (data) {
      var list = $("logList");
      var entries = data.entries || [];
      var stale = log.seq > 0 && ((data.oldest > 0 && log.seq < data.oldest - 1) ||
        (data.latest > 0 && data.latest < log.seq));
      if (!log.seq || stale) {
        list.textContent = "";
        log.seq = 0;
      }
      var nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 24;
      entries.forEach(function (entry) {
        list.appendChild(renderEntry(entry));
        if (entry.seq > log.seq) { log.seq = entry.seq; }
      });
      while (list.childElementCount > LOG_MAX) { list.removeChild(list.firstChild); }
      var rows = list.childElementCount;
      list.classList.toggle("is-empty", rows === 0);
      $("logCount").textContent = t("logs.count", { n: rows });
      if (nearBottom) { list.scrollTop = list.scrollHeight; }
    }).catch(function (err) {
      if (!log.stopping) {
        $("logCount").textContent = t("logs.failed");
        $("logCount").title = String(err && err.message ? err.message : err);
      }
    }).then(function () { log.inflight = false; });
  }

  function setPaused(paused) {
    log.paused = paused;
    $("live").className = "live" + (paused ? " paused" : "");
    refreshChrome();
    if (!paused) { logTick(); }
  }

  // ---- events ------------------------------------------------------------
  $("langToggle").addEventListener("click", function () {
    applyLang(LANG === "en" ? "zh" : "en");
    try { window.localStorage.setItem(LANG_KEY, LANG); } catch (err) { /* private mode */ }
    // Persist the choice for server-side output (log lines, plist comment)
    // without re-rendering the form, which may hold unsaved edits.
    post("config", { lang: LANG }).then(function (next) {
      if (state) { state.lang = next.lang; }
    }).catch(function () { /* the local switch still works */ });
  });

  $("save").addEventListener("click", function () {
    var params;
    try {
      params = JSON.parse($("params").value || "{}");
    } catch (err) {
      fail("cfgMsg", t("msg.badJSON", { msg: err.message }));
      return;
    }
    if (!params || typeof params !== "object" || Array.isArray(params)) {
      fail("cfgMsg", t("msg.notObject"));
      return;
    }
    busy(["save"], true);
    post("config", {
      upstream: $("upstream").value.trim(),
      timeout: parseFloat($("timeout").value),
      params: params,
      max_concurrent: parseInt($("maxConcurrent").value, 10),
      max_body_size: parseInt($("maxBodySize").value, 10),
      thinking: $("thinking").value,
      system_prompt: {
        mode: $("systemMode").value,
        text: $("systemText").value
      },
      inspector: {
        enabled: $("insEnabled").checked,
        capture_bodies: $("captureBodies").checked,
        retention_days: parseInt($("retentionDays").value, 10) || 0,
        max_rows: parseInt($("maxRows").value, 10) || 0,
        max_body_bytes: parseInt($("maxBodyBytes").value, 10) || 0
      },
      storage: { path: $("dbPath").value.trim() }
    }).then(function (next) {
      render(next);
      msg("cfgMsg", t("msg.saved"), "ok");
      logTick();
    }).catch(function (err) {
      fail("cfgMsg", err);
    }).then(function () { busy(["save"], false); });
  });

  $("defaults").addEventListener("click", function () {
    var d = state && state.defaults;
    if (!d) {
      fail("cfgMsg", t("msg.noDefaults"));
      return;
    }
    $("upstream").value = d.upstream;
    $("timeout").value = String(d.timeout);
    $("params").value = JSON.stringify(d.params, null, 2);
    $("maxConcurrent").value = String(d.max_concurrent);
    $("maxBodySize").value = String(d.max_body_size);
    $("thinking").value = d.thinking || "off";
    $("systemMode").value = (d.system_prompt && d.system_prompt.mode) || "off";
    $("systemText").value = (d.system_prompt && d.system_prompt.text) || "";
    var history = d.inspector || {};
    $("insEnabled").checked = !!history.enabled;
    $("captureBodies").checked = !!history.capture_bodies;
    $("retentionDays").value = String(history.retention_days || 0);
    $("maxRows").value = String(history.max_rows || 0);
    $("maxBodyBytes").value = String(history.max_body_bytes || 0);
    $("dbPath").value = (d.storage && d.storage.path) || "";
    updateParamsMeta();
    msg("cfgMsg", t("msg.defaultsFilled"), "ok");
  });

  $("asToggle").addEventListener("change", function () {
    var install = $("asToggle").checked;
    busy(["asToggle"], true);
    msg("asMsg", install ? t("msg.installing") : t("msg.removing"));
    post("autostart", undefined, install ? "POST" : "DELETE").then(function (next) {
      render(next);
      msg("asMsg", next.message, next.ok ? "ok" : "err");
    }).catch(function (err) {
      fail("asMsg", err);
      render(state);
    }).then(function () { busy(["asToggle"], false); });
  });

  $("shutdown").addEventListener("click", function () {
    if (!window.confirm(t("confirm.shutdown"))) { return; }
    busy(["shutdown"], true);
    msg("cfgMsg", "");
    setStatus(t("status.stopping"), false);
    var stopped = function (text) {
      log.stopping = true;
      setStatus(t("status.stopped"), true);
      $("live").className = "live paused";
      $("liveLabel").textContent = t("live.stopped");
      $("asToggle").disabled = true;
      $("save").disabled = true;
      $("logPause").disabled = true;
      msg("asMsg", text, "ok");
    };
    post("shutdown").then(function (data) {
      stopped(data.message || t("msg.stopped"));
    }).catch(function () {
      // The process may exit before replying; a dropped socket counts too.
      stopped(t("msg.stoppedDisconnected"));
    });
  });

  $("logPause").addEventListener("click", function () { setPaused(!log.paused); });
  $("params").addEventListener("input", updateParamsMeta);

  // Both pages make the same choice: a saved browser choice wins, then the
  // browser locale. The server-seeded language only paints the page before
  // this script runs.
  var initial = "";
  try {
    var saved = window.localStorage.getItem(LANG_KEY);
    if (saved === "en" || saved === "zh") { initial = saved; }
  } catch (err) { /* private mode */ }
  if (!initial) {
    initial = (window.navigator.language || "").toLowerCase().indexOf("zh") === 0 ? "zh" : "en";
  }
  applyLang(initial);
  window.addEventListener("storage", function (event) {
    if (event.key === LANG_KEY && (event.newValue === "en" || event.newValue === "zh")) {
      applyLang(event.newValue);
    }
  });

  loadState().then(function () {
    logTick();
    log.ticker = window.setInterval(logTick, POLL_MS);
  });
})();
</script>
</body>
</html>
