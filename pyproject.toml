[project]
name = "ollama-nothink-proxy"
version = "0.1.0"
description = "Tiny local proxy that turns thinking off (and injects generation params) for Ollama's OpenAI-compatible endpoint"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
ollama-nothink-proxy = "ollama_nothink_proxy:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ollama_nothink_proxy"]

[tool.ruff]
target-version = "py39"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# 项目要支持 Python 3.9：保留 typing.Optional/Dict 写法
# BLE001：代理层需要兜住上游/网络的所有异常，异常必须降级为 502 而不是打死进程
# RUF001/2/3：中文注释与日志里的全角标点是刻意的
ignore = ["UP006", "UP035", "UP045", "BLE001", "RUF001", "RUF002", "RUF003"]
